name: Fix package filenames

on:
  push:
    branches: [apk, ipk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------
      # 修正 .apk / .ipk 文件名：部分构建产物把版本中的 '~'（git hash 分隔符）
      # 写成了 '.'，而包内元数据版本仍是 '~'（如 26.221.69441~0f2ef3d）。
      # 索引按包内版本生成，文件名必须与之一致，否则安装时报
      # "package mentioned in index not found (try 'apk update')"。
      # ---------------------------------------------------------------
      - name: Fix package filenames
        shell: bash
        run: |
          set -euo pipefail
          FIXED=0
          while IFS= read -r -d '' f; do
            case "$f" in
              *.apk) ext="apk" ;;
              *.ipk) ext="ipk" ;;
              *) continue ;;
            esac
            base="${f%.${ext}}"
            # 匹配: '.' + 6-10 位 hex git hash，可选 '-rN' 发行号与 ipk 的 '_arch' 后缀
            if [[ "$base" =~ \.([0-9a-fA-F]{6,10})(-r[0-9]+)?(_[^.]+)?$ ]]; then
              hash="${BASH_REMATCH[1]}"
              suffix="${BASH_REMATCH[2]}${BASH_REMATCH[3]}"
              target="${base%${BASH_REMATCH[0]}}~${hash}${suffix}.${ext}"
              if [[ "$target" != "$f" ]]; then
                if [[ -e "$target" ]]; then
                  rm -f "$f"
                  echo "移除重复: ${f}（已存在 ${target}）"
                else
                  mv -f "$f" "$target"
                  echo "修正文件名: ${f} -> ${target}"
                fi
                FIXED=$((FIXED+1))
              fi
            fi
          done < <(find . -type f \( -name '*.apk' -o -name '*.ipk' \) -print0)
          echo "共修正 ${FIXED} 个包文件名"

      # ---------------------------------------------------------------
      # 重建 ipk 索引（Packages / Packages.gz / Packages.manifest）
      # 使索引中的 Filename 与修正后的文件名一致；旧签名已失效则删除。
      # apk 分支无 .ipk 文件，自动跳过；apk 的 packages.adb 由固件构建时
      # 用 mkndx 重新生成（index.json 不含文件名，无需重建）。
      # ---------------------------------------------------------------
      - name: Rebuild ipk indexes
        shell: bash
        run: |
          python3 .github/scripts/rebuild-ipk-index.py x86_64 aarch64_generic aarch64_cortex-a53

      # ---------------------------------------------------------------
      # 有变更则自动提交推送（GITHUB_TOKEN 推送不会再次触发本工作流）
      # ---------------------------------------------------------------
      - name: Commit and push fixes
        shell: bash
        run: |
          git config user.name "MinimaxFlora"
          git config user.email "minimaxflora@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "fix: 自动修正包文件名（~ 被写成 .）并重建索引"
            git push --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
            echo "已推送修正"
          fi
